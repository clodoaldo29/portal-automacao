<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Projetos de Automação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #edf1f5; --surface: #ffffff; --surface-2: #f4f7fa; --ink: #0f2238; --muted: #5a6e85; --line: #d6dfe9;
    --band: #0b3a6b; --band-2: #0a3260; --band-ink: #ffffff; --band-muted: #bcd0e6;
    --grid-line: rgba(255,255,255,.07); --grid-line-2: rgba(255,255,255,.14);
    --accent: #f2c230; --accent-ink: #0b2440; --link: #0f5aa8;
    --st-estudo: #7a8ca1; --st-validacao: #d79a10; --st-aprovado: #1f9a5c; --st-implantacao: #1572d6; --st-pausado: #b04f4f;
    --cover-bg: #0d2c4f;
    --shadow: 0 1px 2px rgba(15,34,56,.06), 0 8px 22px rgba(15,34,56,.07);
    --font-display: "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif;
    --font-body: "Inter", "Segoe UI", Arial, sans-serif;
    --font-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1420; --surface: #112237; --surface-2: #0d1c2e; --ink: #e6eef7; --muted: #95aac1; --line: #233a54;
      --band-2: #082b52; --link: #7cb8ff;
      --st-estudo: #a2b2c4; --st-validacao: #f0b33a; --st-aprovado: #45c584; --st-implantacao: #5aa9ff; --st-pausado: #e48585;
      --cover-bg: #0b2240; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.28);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .band {
    color: var(--band-ink); border-bottom: 4px solid var(--accent); background-color: var(--band);
    background-image:
      linear-gradient(var(--grid-line-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line-2) 1px, transparent 1px),
      linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(160deg, var(--band) 0%, var(--band-2) 100%);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px, 100% 100%;
    background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px, 0 0;
  }
  .band .wrap { padding-block: 26px 22px; display: grid; gap: 18px; }
  .eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .band h1 { margin: 6px 0 0; font-family: var(--font-display); font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; line-height: 1; }
  .band p { margin: 6px 0 0; color: var(--band-muted); font-size: 14.5px; max-width: 62ch; }
  .totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,.18); }
  .totals div { padding: 12px 14px 2px 0; display: grid; gap: 2px; }
  .totals div + div { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.18); }
  .totals b { font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .totals span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--band-muted); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding-block: 20px 6px; }
  .search { flex: 1 1 260px; min-width: 0; display: flex; }
  .search input { width: 100%; font: 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 600 14px/1 var(--font-display); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .chip[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
  .chip i { font-style: normal; opacity: .8; }
  .filters select { font: 600 14px var(--font-display); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; padding-block: 12px 40px; align-items: start; }
  .card { --st: var(--st-estudo); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .card.s-validacao { --st: var(--st-validacao); } .card.s-aprovado { --st: var(--st-aprovado); }
  .card.s-implantacao { --st: var(--st-implantacao); } .card.s-pausado { --st: var(--st-pausado); }
  .stripe { height: 5px; background: var(--st); }
  .cover { position: relative; aspect-ratio: 5 / 2; background: var(--cover-bg); overflow: hidden; display: block; }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 30px 30px; color: rgba(255,255,255,.85); font: 700 36px/1 var(--font-display); }
  .status { position: absolute; top: 10px; left: 10px; font: 600 12.5px/1 var(--font-display); padding: 6px 10px 6px 9px; border-radius: 999px; background: rgba(8,20,36,.78); color: #fff; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st); margin-right: 7px; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .client { font: 500 11.5px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card h2 { margin: 3px 0 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
  .desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { -webkit-line-clamp: unset; display: block; }
  .more { align-self: start; background: none; border: 0; padding: 0; color: var(--link); font: 600 13.5px var(--font-body); cursor: pointer; }
  .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .metric { background: var(--surface-2); padding: 6px 9px 7px; min-width: 0; }
  .metric span { display: block; font: 500 9.5px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .metric b { display: block; margin-top: 2px; font: 700 15.5px/1.15 var(--font-display); overflow-wrap: anywhere; }
  .open-sim { display: flex; align-items: center; justify-content: center; text-decoration: none; font: 600 14.5px/1 var(--font-display); color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 11px 12px; }
  .foot { font-size: 12px; color: var(--muted); }
  .state { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 30px 22px; text-align: center; color: var(--muted); }
  .state h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 22px; color: var(--ink); }
  @media (max-width: 640px) {
    .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .totals div:nth-child(3) { padding-left: 0; border-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: transform .18s ease; } .card:hover { transform: translateY(-2px); }
  }
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div>
      <div class="eyebrow">Portfólio · Automação industrial</div>
      <h1>Projetos de Automação</h1>
      <p>Simulações 3D, estudos de robôs e decisões de cada linha, em um só lugar.</p>
    </div>
    <div class="totals" id="totals"></div>
  </div>
</header>
<main class="wrap">
  <div class="filters" role="search">
    <div class="search"><input id="q" type="search" placeholder="Buscar por cliente, projeto ou descrição" aria-label="Buscar projetos"></div>
    <select id="f-client" aria-label="Filtrar por cliente"><option value="">Todos os clientes</option></select>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por status"></div>
  </div>
  <section class="grid" id="grid" aria-live="polite"><div class="state"><h2>Carregando projetos…</h2></div></section>
</main>
<script>
(() => {
  const STATUS = [
    { id: 'estudo', label: 'Em estudo' }, { id: 'validacao', label: 'Em validação' }, { id: 'aprovado', label: 'Aprovado' },
    { id: 'implantacao', label: 'Em implantação' }, { id: 'pausado', label: 'Pausado' },
  ];
  const METRICS = [['uph', 'UPH'], ['robots', 'Robôs'], ['models', 'Produtos'], ['stations', 'Estações']];
  const statusOf = id => STATUS.find(s => s.id === id) || STATUS[0];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); Object.assign(n, props); kids.flat().forEach(k => k != null && n.append(k)); return n; };
  const initials = s => (s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  const fmtDate = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
  // links: same-site paths or https only
  const safeUrl = u => (/^https:\/\//i.test(u || '') || /^[a-z0-9][a-z0-9\-_/.]*$/i.test(u || '') ? u : '');
  let projects = [], statusFilter = '';
  const expanded = new Set();

  function renderTotals() {
    const n = id => projects.filter(p => p.status === id).length;
    const vals = [projects.length, new Set(projects.map(p => p.client)).size, n('estudo') + n('validacao') + n('implantacao'), n('aprovado')];
    const box = $('totals'); box.textContent = '';
    ['projetos', 'clientes', 'em andamento', 'aprovados'].forEach((l, i) => box.append(el('div', {}, el('b', { textContent: String(vals[i]) }), el('span', { textContent: l }))));
  }
  function renderFilters() {
    const chips = $('chips'); chips.textContent = '';
    const mk = (id, label, count, color) => {
      const b = el('button', { type: 'button', className: 'chip' }, color ? el('span', { className: 'dot', style: `color: var(${color})` }) : null, label, el('i', { textContent: String(count) }));
      b.setAttribute('aria-pressed', String(statusFilter === id));
      b.onclick = () => { statusFilter = statusFilter === id ? '' : id; renderFilters(); renderGrid(); };
      return b;
    };
    chips.append(mk('', 'Todos', projects.length));
    STATUS.forEach(s => { const c = projects.filter(p => p.status === s.id).length; if (c) chips.append(mk(s.id, s.label, c, `--st-${s.id}`)); });
  }
  function fillClients() {
    const sel = $('f-client');
    [...new Set(projects.map(p => p.client).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(c => sel.append(el('option', { value: c, textContent: c })));
  }
  function card(p) {
    const st = statusOf(p.status), url = safeUrl(p.url);
    const c = el('article', { className: `card s-${st.id}` }, el('div', { className: 'stripe' }));
    const cov = el(url ? 'a' : 'div', { className: 'cover' });
    if (url) { cov.href = url; cov.setAttribute('aria-label', `Abrir simulação ${p.name}`); }
    if (p.cover) cov.append(el('img', { src: p.cover, alt: '', loading: 'lazy' })); else cov.append(el('div', { className: 'ph', textContent: initials(p.name) }));
    cov.append(el('span', { className: 'status', textContent: st.label }));
    c.append(cov);
    const b = el('div', { className: 'body' });
    b.append(el('div', {}, el('div', { className: 'client', textContent: p.client || '' }), el('h2', { textContent: p.name })));
    if (p.description) {
      b.append(el('p', { className: 'desc' + (expanded.has(p.id) ? ' open' : ''), textContent: p.description }));
      if (p.description.length > 140) {
        const more = el('button', { type: 'button', className: 'more', textContent: expanded.has(p.id) ? 'Mostrar menos' : 'Ler descrição completa' });
        more.onclick = () => { expanded.has(p.id) ? expanded.delete(p.id) : expanded.add(p.id); renderGrid(); };
        b.append(more);
      }
    }
    const m = p.metrics || {};
    if (METRICS.some(([k]) => m[k])) b.append(el('div', { className: 'metrics' }, METRICS.map(([k, l]) => el('div', { className: 'metric' }, el('span', { textContent: l }), el('b', { textContent: m[k] || '—' })))));
    if (url) b.append(el('a', { className: 'open-sim', href: url, textContent: 'Abrir simulação 3D' }));
    if (p.updatedAt) b.append(el('div', { className: 'foot', textContent: `Atualizado em ${fmtDate(p.updatedAt)}` }));
    c.append(b);
    return c;
  }
  function renderGrid() {
    const grid = $('grid'); grid.textContent = '';
    const q = $('q').value.trim().toLowerCase(), cl = $('f-client').value;
    const list = projects
      .filter(p => !statusFilter || p.status === statusFilter)
      .filter(p => !cl || p.client === cl)
      .filter(p => !q || [p.client, p.name, p.description, ...Object.values(p.metrics || {})].join(' ').toLowerCase().includes(q))
      .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    if (!list.length) { grid.append(el('div', { className: 'state' }, el('h2', { textContent: projects.length ? 'Nenhum projeto com esses filtros' : 'Nenhum projeto publicado ainda' }))); return; }
    list.forEach(p => grid.append(card(p)));
  }
  $('q').addEventListener('input', renderGrid);
  $('f-client').addEventListener('change', renderGrid);

  fetch('projetos.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { projects = Array.isArray(data) ? data : []; renderTotals(); renderFilters(); fillClients(); renderGrid(); })
    .catch(() => {
      const grid = $('grid'); grid.textContent = '';
      grid.append(el('div', { className: 'state' }, el('h2', { textContent: 'Não foi possível carregar os projetos' }),
        el('p', { textContent: location.protocol === 'file:' ? 'Aberto direto do disco o navegador bloqueia a leitura do projetos.json. Use o site publicado ou um servidor local.' : 'Recarregue a página em alguns instantes.' })));
    });
})();
</script>
</body>
</html>
