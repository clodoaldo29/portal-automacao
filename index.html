<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Projetos de Automação</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div>
      <div class="eyebrow">Portfólio · Automação industrial</div>
      <h1>Projetos de Automação</h1>
      <p>Simulações 3D, estudos de robôs e decisões de cada linha, em um só lugar.</p>
    </div>
    <div class="totals" id="totals"></div>
  </div>
</header>
<main class="wrap">
  <div class="filters" role="search">
    <div class="search"><input id="q" type="search" placeholder="Buscar por cliente, projeto ou descrição" aria-label="Buscar projetos"></div>
    <select id="f-client" aria-label="Filtrar por cliente"><option value="">Todos os clientes</option></select>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por status"></div>
  </div>
  <section class="grid" id="grid" aria-live="polite"><div class="state"><h2>Carregando projetos…</h2></div></section>
</main>
<script type="module" src="/src/portal/main.ts"></script>
</body>
</html>
